<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BF2142 Key Generator</title>
<meta name="description" content="Offline CD key generator for Battlefield 2142. Reverse-engineered CDKey2 algorithm. No server required.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0c10;
    --bg-panel: #0d1017;
    --bg-field: #080a0e;
    --fg: #c8cdd6;
    --fg-dim: #5a6270;
    --accent: #e07a2f;
    --accent-glow: rgba(224, 122, 47, 0.25);
    --accent-dim: #b55f1e;
    --grid: rgba(90, 98, 112, 0.08);
    --border: rgba(90, 98, 112, 0.2);
    --success: #3ddc84;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #e8eaee;
      --bg-panel: #f2f3f5;
      --bg-field: #ffffff;
      --fg: #1a1d24;
      --fg-dim: #6b7280;
      --accent: #c86820;
      --accent-glow: rgba(200, 104, 32, 0.15);
      --accent-dim: #a35518;
      --grid: rgba(0, 0, 0, 0.04);
      --border: rgba(0, 0, 0, 0.12);
      --success: #2d9e5e;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #e8eaee;
    --bg-panel: #f2f3f5;
    --bg-field: #ffffff;
    --fg: #1a1d24;
    --fg-dim: #6b7280;
    --accent: #c86820;
    --accent-glow: rgba(200, 104, 32, 0.15);
    --accent-dim: #a35518;
    --grid: rgba(0, 0, 0, 0.04);
    --border: rgba(0, 0, 0, 0.12);
    --success: #2d9e5e;
    color-scheme: light;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    overflow-x: hidden;
  }

  /* Scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--grid) 2px, var(--grid) 4px);
    z-index: 100;
  }

  .wrap { width: 100%; max-width: 540px; }

  .header { text-align: center; margin-bottom: 28px; }
  .header .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .header h1 {
    font-weight: 700;
    font-size: clamp(28px, 7vw, 38px);
    text-transform: uppercase;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .header h1 span { color: var(--accent); }
  .header .sub {
    font-size: 13px;
    color: var(--fg-dim);
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 24px;
    position: relative;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .key-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    align-items: center;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .key-group {
    background: var(--bg-field);
    border: 1px solid var(--border);
    padding: 10px 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(16px, 4.5vw, 22px);
    letter-spacing: 2px;
    color: var(--accent);
    min-width: 70px;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
    user-select: all;
  }
  .key-group.active {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .key-sep {
    color: var(--fg-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    user-select: none;
  }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 12px 16px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--fg-dim); }

  .status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    text-align: center;
    margin-top: 14px;
    min-height: 16px;
    transition: color 0.2s;
  }
  .status.copied { color: var(--success); }

  .history { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
  .history-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--fg-dim);
    margin-bottom: 10px;
  }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    background: var(--bg-field);
    border: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .idx { color: var(--fg-dim); font-size: 10px; min-width: 20px; }
  .history-item .hkey { flex: 1; letter-spacing: 1px; }
  .history-item .copy-sm { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

  .corner { position: absolute; width: 12px; height: 12px; }
  .corner::before, .corner::after { content: ""; position: absolute; background: var(--accent); }
  .corner-tl { top: -1px; left: -1px; }
  .corner-tl::before { top: 0; left: 0; width: 12px; height: 1px; }
  .corner-tl::after  { top: 0; left: 0; width: 1px; height: 12px; }
  .corner-tr { top: -1px; right: -1px; }
  .corner-tr::before { top: 0; right: 0; width: 12px; height: 1px; }
  .corner-tr::after  { top: 0; right: 0; width: 1px; height: 12px; }
  .corner-bl { bottom: -1px; left: -1px; }
  .corner-bl::before { bottom: 0; left: 0; width: 12px; height: 1px; }
  .corner-bl::after  { bottom: 0; left: 0; width: 1px; height: 12px; }
  .corner-br { bottom: -1px; right: -1px; }
  .corner-br::before { bottom: 0; right: 0; width: 12px; height: 1px; }
  .corner-br::after  { bottom: 0; right: 0; width: 1px; height: 12px; }

  .footer {
    text-align: center;
    margin-top: 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Electronic Arts &bull; 2006</div>
    <h1>Battlefield <span>2142</span></h1>
    <div class="sub">CD Key Generator</div>
  </div>

  <div class="panel" id="panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="key-row" id="keyRow">
      <div class="key-group active" id="g0">----</div>
      <div class="key-sep">-</div>
      <div class="key-group" id="g1">----</div>
      <div class="key-sep">-</div>
      <div class="key-group" id="g2">----</div>
      <div class="key-sep">-</div>
      <div class="key-group" id="g3">----</div>
      <div class="key-sep">-</div>
      <div class="key-group" id="g4">----</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="genBtn">Generate</button>
      <button class="btn btn-secondary" id="copyBtn">Copy</button>
    </div>

    <div class="status" id="status"></div>

    <div class="history" id="historySection" hidden>
      <div class="history-label">Previous Keys</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="footer">CDKey2 algorithm &bull; offline keygen &bull; no server required</div>
</div>

<script>
(function() {
  var NORMAL  = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  var SCRAMBL = "64382957JKLMNPQRSTUVWXYZABCDEFGH";
  var SHUF = [2, 4, 5, 7, 12, 1, 3];
  var MAGIC = 125732;
  var POLY = 0xEDB88320;

  var crcTab = new Uint32Array(256);
  for (var i = 0; i < 256; i++) {
    var c = i;
    for (var j = 0; j < 8; j++) c = (c & 1) ? ((c >>> 1) ^ POLY) : (c >>> 1);
    crcTab[i] = c >>> 0;
  }

  function crc32(data, init) {
    var crc = init >>> 0;
    for (var i = 0; i < data.length; i++)
      crc = (crcTab[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8)) >>> 0;
    return crc;
  }

  function adler(data, len) {
    var s1 = 1, s2 = 0;
    for (var i = 0; i < len; i++) {
      s1 = (s1 + data[i]) % 0xFFF1;
      s2 = (s2 + s1) % 0xFFF1;
    }
    return ((s1 + (s2 * 65536)) & 0xFFFFFFFF) >>> 0;
  }

  function encScrambled(v) {
    v = v >>> 0;
    var o = new Uint8Array(7);
    o[6] = v & 0x1F;
    o[5] = (v >>> 5) & 0x1F;
    o[4] = (v >>> 10) & 0x1F;
    o[3] = (v >>> 15) & 0x1F;
    o[2] = (v >>> 20) & 0x1F;
    o[0] = (v >>> 30) & 0x3;
    o[1] = (v >>> 25) & 0x1F;
    o[0] = ((o[6] & 7) * 4) | o[0];
    for (var i = 0; i < 7; i++) o[i] = SCRAMBL.charCodeAt(o[i]);
    return o;
  }

  function encNormal(v) {
    v = v >>> 0;
    var o = new Uint8Array(7);
    o[6] = (v & 3) * 8;
    o[5] = (v >>> 2) & 0x1F;
    o[4] = (v >>> 7) & 0x1F;
    o[3] = (v >>> 12) & 0x1F;
    o[2] = (v >>> 17) & 0x1F;
    o[1] = (v >>> 22) & 0x1F;
    var hi = (v >>> 27) & 0x1F;
    o[0] = hi;
    o[6] |= hi & 7;
    for (var i = 0; i < 7; i++) o[i] = NORMAL.charCodeAt(o[i]);
    return o;
  }

  function shuffle(buf) {
    var a = new Uint8Array(buf);
    for (var i = 0; i < SHUF.length; i++) {
      var p = SHUF[i], q = 13 + i;
      var t = a[p]; a[p] = a[q]; a[q] = t;
    }
    return a;
  }

  function generate() {
    var seed = new Uint8Array(13);
    for (var i = 0; i < 13; i++)
      seed[i] = NORMAL.charCodeAt(Math.floor(Math.random() * NORMAL.length));

    var h = adler(seed, 13);
    var scr = encScrambled((MAGIC ^ h) >>> 0);
    var inter = new Uint8Array(20);
    inter.set(seed);
    inter.set(scr, 13);

    var c = crc32(inter, MAGIC);
    var nrm = encNormal(c);
    var unsh = new Uint8Array(20);
    unsh.set(seed);
    unsh.set(nrm, 13);

    var fin = shuffle(unsh);
    var s = "";
    for (var i = 0; i < 20; i++) s += String.fromCharCode(fin[i]);
    return s.slice(0,4) + "-" + s.slice(4,8) + "-" + s.slice(8,12) + "-" + s.slice(12,16) + "-" + s.slice(16,20);
  }

  var groups = [
    document.getElementById("g0"),
    document.getElementById("g1"),
    document.getElementById("g2"),
    document.getElementById("g3"),
    document.getElementById("g4")
  ];
  var statusEl = document.getElementById("status");
  var histSec = document.getElementById("historySection");
  var histList = document.getElementById("historyList");
  var genBtn = document.getElementById("genBtn");
  var copyBtn = document.getElementById("copyBtn");

  var currentKey = "";
  var history = [];

  function displayKey(key) {
    var parts = key.split("-");
    groups.forEach(function(g, i) {
      g.textContent = parts[i];
      g.classList.remove("active");
    });
    setTimeout(function() {
      groups.forEach(function(g, i) {
        setTimeout(function() { g.classList.add("active"); }, i * 60);
      });
    }, 10);
  }

  function addHistory(key) {
    history.unshift(key);
    if (history.length > 20) history.pop();
    histSec.hidden = false;
    renderHistory();
  }

  function renderHistory() {
    histList.innerHTML = "";
    history.forEach(function(k, i) {
      var el = document.createElement("div");
      el.className = "history-item";
      el.innerHTML = '<span class="idx">#' + (i + 1) + '</span><span class="hkey">' + k + '</span><span class="copy-sm">copy</span>';
      el.addEventListener("click", function() { copyKey(k); });
      histList.appendChild(el);
    });
  }

  function copyKey(key) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(key).then(function() {
        statusEl.textContent = "COPIED TO CLIPBOARD";
        statusEl.className = "status copied";
        setTimeout(function() { statusEl.textContent = ""; statusEl.className = "status"; }, 2000);
      }, function() {
        fallbackCopy(key);
      });
    } else {
      fallbackCopy(key);
    }
  }

  function fallbackCopy(key) {
    var ta = document.createElement("textarea");
    ta.value = key;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      statusEl.textContent = "COPIED TO CLIPBOARD";
      statusEl.className = "status copied";
      setTimeout(function() { statusEl.textContent = ""; statusEl.className = "status"; }, 2000);
    } catch(e) {
      statusEl.textContent = key;
      statusEl.className = "status";
    }
    document.body.removeChild(ta);
  }

  genBtn.addEventListener("click", function() {
    if (currentKey) addHistory(currentKey);
    currentKey = generate();
    displayKey(currentKey);
    statusEl.textContent = "";
    statusEl.className = "status";
  });

  copyBtn.addEventListener("click", function() {
    if (currentKey) copyKey(currentKey);
  });

  currentKey = generate();
  displayKey(currentKey);
})();
</script>
</body>
</html>
